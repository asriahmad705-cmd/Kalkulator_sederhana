<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101426">
  <title>Kalkulator Sederhana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="calculator" aria-label="Kalkulator">
      <header class="calculator__header">
        <div>
          <p class="eyebrow">KALKULATOR DIGITAL</p>
          <h1>Kalkulator</h1>
        </div>
        <span class="status-dot" aria-label="Siap digunakan"></span>
      </header>

      <div class="display">
        <div class="display__label">HASIL PERHITUNGAN</div>
        <input id="layar" type="text" value="0" readonly aria-label="Layar kalkulator">
      </div>

      <div class="keys">
        <button class="key key--utility" type="button" data-action="clear">AC</button>
        <button class="key key--utility" type="button" data-action="backspace" aria-label="Hapus satu karakter">⌫</button>
        <button class="key key--utility" type="button" data-value="%">%</button>
        <button class="key key--operator" type="button" data-value="/">÷</button>

        <button class="key" type="button" data-value="7">7</button>
        <button class="key" type="button" data-value="8">8</button>
        <button class="key" type="button" data-value="9">9</button>
        <button class="key key--operator" type="button" data-value="*">×</button>

        <button class="key" type="button" data-value="4">4</button>
        <button class="key" type="button" data-value="5">5</button>
        <button class="key" type="button" data-value="6">6</button>
        <button class="key key--operator" type="button" data-value="-">−</button>

        <button class="key" type="button" data-value="1">1</button>
        <button class="key" type="button" data-value="2">2</button>
        <button class="key" type="button" data-value="3">3</button>
        <button class="key key--operator" type="button" data-value="+">+</button>

        <button class="key key--utility" type="button" data-action="sign">±</button>
        <button class="key" type="button" data-value="0">0</button>
        <button class="key" type="button" data-value=".">.</button>
        <button class="key key--equals" type="button" data-action="equals">=</button>
      </div>
      <footer class="calculator__footer">Sederhana, cepat, dan praktis.</footer>
    </section>
  </main>
</body>
</html>
